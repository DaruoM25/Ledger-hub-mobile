name: Mobile CI (KMP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-common-qa:
    name: Android & Common Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  ios-validation:
    name: iOS Build & KMP Validation (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile iOS Simulator Target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Link iOS Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
