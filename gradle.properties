org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── Extraction native de sqlite-jdbc (US-16) ──────────────────────────────────
# sqlite-jdbc extrait sa DLL/.so au premier accès. La pointer vers le Temp PARTAGÉ de
# l'utilisateur la met en concurrence avec tout autre outil qui embarque sa propre version :
# sous Windows une DLL chargée reste verrouillée, les extractions abandonnées par un process tué
# s'y accumulent, et la tâche verifyCommonMainLedgerHubDatabaseMigration finissait par tuer sa
# JVM au chargement du binaire.
#
# Aucun chemin n'est fixé ici : un chemin absolu codé en dur rendrait le dépôt non portable, et
# un chemin relatif dépendrait du répertoire de travail de la JVM. Le répertoire (local au projet,
# jetable avec `clean`) est calculé et posé en absolu par le root build.gradle.kts dès la phase de
# configuration, et par composeApp/build.gradle.kts pour les JVM de test forkées.
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.cocoapods.generate.wrapper=true
